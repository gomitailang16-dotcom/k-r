<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>オフラインAI</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#faf9f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="オフラインAI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{--bg:#faf9f5;--panel:#ffffff;--panel2:#f0eee6;--side:#f5f4ed;--line:#e4e1d6;--text:#2b2a27;--sub:#7b7870;--acc:#c96442;--acc-fg:#ffffff;--me:#eee9dc;--ok:#3f7d4e;--warn:#b5641a;--code:#f3f1e8;--serif:ui-serif,"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;color-scheme:light}
  @media(prefers-color-scheme:dark){:root{--bg:#262624;--panel:#30302e;--panel2:#3a3a37;--side:#1f1e1d;--line:#42413d;--text:#ece9e0;--sub:#a09d93;--acc:#d97757;--acc-fg:#1f1e1d;--me:#3a3935;--ok:#7ccf93;--warn:#e0a060;--code:#1f1e1d;color-scheme:dark}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:15px/1.75 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg)}
  header h1{font-size:18px;margin:0;flex:1;display:flex;align-items:center;gap:10px;font-weight:500}
  header h1 b{font-family:var(--serif);font-weight:500;color:var(--text);letter-spacing:.02em}
  .pill{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
  .pill.on{color:var(--ok)}.pill.off{color:var(--warn)}
  button,select,input{font:inherit;color:var(--text)}
  button,select{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 13px;cursor:pointer}
  button:hover{background:var(--panel2)}
  button.primary{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);font-weight:600}
  button.primary:hover{filter:brightness(1.06);background:var(--acc)}
  button:disabled{opacity:.45;cursor:default}
  input[type=text],input[type=number],textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--text);font:inherit}
  input:focus,textarea:focus,select:focus-visible,button:focus-visible{outline:2px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:1px}
  #login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
  #login h2{font-family:var(--serif);font-weight:500;font-size:28px}
  #login p{color:var(--sub);max-width:480px;margin:0}
  #app{flex:1;display:none;min-height:0}
  #side{width:230px;background:var(--side);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
  #side .top{padding:12px}
  #side .top button{width:100%;border-radius:12px}
  #list{flex:1;overflow:auto;padding:0 8px 8px}
  .chat{padding:8px 10px;border-radius:10px;cursor:pointer;font-size:14px;display:flex;gap:6px;align-items:center}
  .chat span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chat:hover,.chat.cur{background:var(--panel2)}
  .chat i{font-style:normal;color:var(--sub);opacity:0}.chat:hover i{opacity:1}
  #work{flex:1;display:flex;min-width:0;min-height:0}
  #col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  #setup{padding:4px 16px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:780px;width:100%;margin:0 auto}
  #setup .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  #setup .seg button{border:0;border-radius:0;color:var(--sub)}
  #setup .seg button.cur{background:var(--panel2);color:var(--text);font-weight:600}
  #url{width:200px}
  #bar{flex:1;min-width:100px;height:4px;background:var(--panel2);border-radius:4px;overflow:hidden}
  #bar div{height:100%;width:0;background:var(--acc);transition:width .2s}
  #status{font-size:12px;color:var(--sub);width:100%;line-height:1.6}
  details#adv{width:100%;font-size:13px;color:var(--sub)}
  details#adv summary{cursor:pointer}
  details#adv .row{display:flex;gap:12px;align-items:flex-start;margin-top:10px;flex-wrap:wrap}
  details#adv .grow{flex:1;min-width:260px;display:flex;flex-direction:column;gap:6px}
  details#adv textarea{width:100%;height:88px;resize:vertical}
  details#adv .savebar{display:flex;gap:10px;align-items:center}
  #msgs{flex:1;overflow:auto;padding:10px 16px 18px;scroll-behavior:smooth}
  .m{max-width:740px;margin:0 auto 18px;word-break:break-word}
  .m.user{background:var(--me);border-radius:18px;padding:9px 16px;width:fit-content;margin-left:auto;margin-right:auto;max-width:740px;white-space:pre-wrap;position:relative;left:0}
  .m.assistant{font-family:var(--serif);font-size:16px;line-height:1.85;padding:2px 4px}
  .m h2,.m h3,.m h4{margin:.7em 0 .3em;line-height:1.4;font-weight:600}
  .m ul,.m ol{margin:.4em 0;padding-left:1.4em}
  .m code{background:var(--code);border:1px solid var(--line);padding:0 5px;border-radius:6px;font:13px ui-monospace,Menlo,Consolas,monospace}
  .cb{margin:.7em 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code);font-family:system-ui,sans-serif}
  .cb .ch{display:flex;justify-content:space-between;align-items:center;padding:4px 12px;font-size:12px;color:var(--sub)}
  .cb .ch button{padding:1px 9px;font-size:12px}
  .cb pre{margin:0;padding:10px 14px;overflow:auto;max-height:340px}
  .cb pre code{background:none;border:0;padding:0;white-space:pre;line-height:1.6}
  #empty{max-width:640px;margin:10vh auto 0;text-align:center;color:var(--sub)}
  #empty h2{font-family:var(--serif);font-weight:500;font-size:30px;color:var(--text);margin:0 0 10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
  .chips button{font-size:13px;border-radius:99px;color:var(--sub)}
  #form{display:flex;align-items:flex-end;gap:8px;max-width:740px;width:calc(100% - 32px);margin:0 auto 16px;padding:8px 8px 8px 18px;background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  #input{flex:1;resize:none;max-height:180px;border:0;background:transparent;padding:8px 0;border-radius:0}
  #input:focus{outline:none}
  #form button{border-radius:14px;height:38px}
  #user{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
  #user img{width:26px;height:26px;border-radius:50%}
  #pv{width:46%;min-width:320px;border-left:1px solid var(--line);display:none;flex-direction:column;background:var(--bg)}
  #pv.on{display:flex}
  #pvbar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  #pvbar .sp{flex:1}
  #pvbody{flex:1;position:relative;min-height:0;background:#fff}
  #frame{width:100%;height:100%;border:0;background:#fff;display:block}
  #code{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0;background:var(--code);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:none;white-space:pre;overflow:auto}
  #pvempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);background:var(--panel2);text-align:center;padding:20px}
  #pvtoggle{display:none}
  @media(max-width:900px){
    #side{display:none}
    #pv{position:fixed;inset:0;width:100%;z-index:20}
    #pvtoggle.vis{display:inline-block}
  }
</style>
</head>
<body>
<header>
  <h1><b>オフラインAI</b><span class="pill" style="font-weight:400">制限なし・端末内で動作</span></h1>
  <span id="net" class="pill">…</span>
  <span id="user"></span>
  <button id="logout" style="display:none">ログアウト</button>
</header>

<div id="login">
  <h2 style="margin:0">Googleでログインして始める</h2>
  <p>AIはあなたの端末の中で動きます。一度準備すれば、オフラインで、回数・文字数の制限なく使えます。会話はこの端末にだけ保存されます。</p>
  <div id="gbtn"></div>
  <p id="cfgwarn" style="color:var(--warn);display:none">⚠ GOOGLE_CLIENT_ID が未設定です。index.html 上部の設定を書き換えてください(README参照)。</p>
  <button id="guest" style="display:none">(ログインせず端末内だけで使う)</button>
</div>

<div id="app">
  <aside id="side">
    <div class="top"><button id="new" class="primary">＋ 新しい会話</button></div>
    <div id="list"></div>
  </aside>

  <div id="work">
    <section id="col">
      <div id="setup">
        <div class="seg" id="modeseg">
          <button data-m="chat">💬 チャット</button>
          <button data-m="app">🛠 アプリ作成</button>
        </div>
        <div class="seg" id="beseg">
          <button data-b="web">ブラウザ内AI</button>
          <button data-b="server">高性能(Ollama等)</button>
        </div>
        <input type="text" id="url" placeholder="http://localhost:11434">
        <select id="model"></select>
        <button id="load" class="primary">読み込む</button>
        <button id="pvtoggle">プレビュー</button>
        <div id="bar"><div></div></div>
        <div id="status"></div>
        <details id="adv">
          <summary>⚙ 設定(AIへの指示など)</summary>
          <div class="row">
            <div class="grow">
              <label for="custom" style="color:var(--text)">AIへの指示(毎回必ず守らせます)</label>
              <textarea id="custom" placeholder="例: 常に敬語で答えて。結論を先に書いて。"></textarea>
              <div class="savebar">
                <button id="saveCustom" class="primary" disabled>保存済み ✓</button>
                <span id="saveNote">文字を入力すると、保存できます。</span>
              </div>
            </div>
            <label>温度 <input type="number" id="temp" min="0" max="2" step="0.1" value="0.7" style="width:70px"></label>
            <button id="export">会話を書き出し</button>
          </div>
        </details>
      </div>

      <div id="msgs"></div>

      <form id="form">
        <textarea id="input" rows="1" placeholder="メッセージを入力(Enterで送信 / Shift+Enterで改行)"></textarea>
        <button id="send" class="primary" disabled>送信</button>
        <button id="stop" type="button" style="display:none">停止</button>
      </form>
    </section>

    <aside id="pv">
      <div id="pvbar">
        <button id="tabPrev" class="primary">プレビュー</button>
        <button id="tabCode">コード</button>
        <span class="sp"></span>
        <button id="pvApply" style="display:none">適用</button>
        <button id="pvReload" title="再読み込み">↻</button>
        <button id="pvOpen">別タブ</button>
        <button id="pvDl">保存</button>
        <button id="pvClose">✕</button>
      </div>
      <div id="pvbody">
        <div id="pvempty">「アプリ作成」モードで作りたいものを伝えると、<br>ここに動くアプリが表示されます。</div>
        <iframe id="frame" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-pointer-lock" style="display:none"></iframe>
        <textarea id="code" spellcheck="false"></textarea>
      </div>
    </aside>
  </div>
</div>

<script type="module">
// ================= 設定 =================
// Google Cloud Console で「OAuth クライアント ID(ウェブ アプリケーション)」を作り、ここに貼る。
const GOOGLE_CLIENT_ID = "332246657127-v9ah60of79gi29ps7e5d5lpelss8p8lk.apps.googleusercontent.com";
// 試すためだけに Googleログインなしで使いたい場合は true
const ALLOW_GUEST = true;

const WEB_MODELS = [
  ["Qwen2.5-Coder-7B-Instruct-q4f16_1-MLC", "Qwen2.5 Coder 7B(アプリ作成向け・要GPU/約5GB)"],
  ["Qwen2.5-Coder-3B-Instruct-q4f16_1-MLC", "Qwen2.5 Coder 3B(アプリ作成・軽め/約2GB)"],
  ["Qwen2.5-7B-Instruct-q4f16_1-MLC", "Qwen2.5 7B(会話・日本語/約5GB)"],
  ["Qwen2.5-3B-Instruct-q4f16_1-MLC", "Qwen2.5 3B(会話・バランス/約2GB)"],
  ["Qwen2.5-1.5B-Instruct-q4f16_1-MLC", "Qwen2.5 1.5B(軽量/約1GB)"],
  ["Llama-3.1-8B-Instruct-q4f16_1-MLC", "Llama 3.1 8B(英語に強い/約5GB)"],
  ["gemma-2-2b-it-q4f16_1-MLC", "Gemma 2 2B(約1.5GB)"],
  ["Qwen2.5-Coder-1.5B-Instruct-q4f16_1-MLC", "Qwen2.5 Coder 1.5B(アプリ作成・iPad向け/約1GB)"],
  ["Llama-3.2-1B-Instruct-q4f16_1-MLC", "Llama 3.2 1B(超軽量/約0.7GB)"],
  ["Qwen2.5-0.5B-Instruct-q4f16_1-MLC", "Qwen2.5 0.5B(最軽量・低性能)"],
];
// iPad / iPhone ではメモリが厳しいので、軽いモデルを初期選択にする
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
// ========================================

const $ = s => document.querySelector(s);
const LS = {
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// ---------- ネット状態 / SW ----------
function net(){const el=$("#net"),on=navigator.onLine;el.textContent=on?"オンライン":"オフライン";el.className="pill "+(on?"on":"off")}
addEventListener("online",net);addEventListener("offline",net);net();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});

// ---------- ログイン ----------
let me = LS.get("oai_user", null);
function parseJwt(t){
  const b=t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
  return JSON.parse(decodeURIComponent(atob(b).split("").map(c=>"%"+c.charCodeAt(0).toString(16).padStart(2,"0")).join("")));
}
function onCredential(res){
  const p=parseJwt(res.credential);
  me={sub:p.sub,name:p.name,email:p.email,picture:p.picture,at:Date.now()};
  LS.set("oai_user",me);enter();
}
function initGoogle(){
  if(!window.google?.accounts?.id){setTimeout(initGoogle,300);return}
  google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:onCredential,auto_select:true});
  google.accounts.id.renderButton($("#gbtn"),{theme:"filled_blue",size:"large",text:"signin_with",locale:"ja"});
}
if(GOOGLE_CLIENT_ID.startsWith("YOUR_")) $("#cfgwarn").style.display="block";
if(ALLOW_GUEST){$("#guest").style.display="";$("#guest").onclick=()=>{me={sub:"guest",name:"ゲスト",at:Date.now()};LS.set("oai_user",me);enter()}}
// クライアントID未設定なら、ログイン画面を飛ばしてすぐ使える(設定なしで動く)
if(!me && GOOGLE_CLIENT_ID.startsWith("YOUR_")){me={sub:"guest",name:"",at:Date.now()};LS.set("oai_user",me)}
if(!me && navigator.onLine) initGoogle();
$("#logout").onclick=()=>{try{google.accounts.id.disableAutoSelect()}catch{} localStorage.removeItem("oai_user");location.reload()};

// ---------- Markdown(軽量) ----------
function codeBlock(l,c){
  return `<div class="cb"><div class="ch"><span>${esc(l||"code")}</span><button data-copy>コピー</button></div><pre><code>${esc(c.replace(/\n$/,""))}</code></pre></div>`;
}
function md(src){
  const blocks=[];
  src=src.replace(/```([\w+-]*)[^\n]*\n([\s\S]*?)(```|$)/g,(m,l,c)=>{blocks.push([l,c]);return "\u0000"+(blocks.length-1)+"\u0000"});
  let h=esc(src);
  h=h.replace(/^### (.*)$/gm,"<h4>$1</h4>").replace(/^## (.*)$/gm,"<h3>$1</h3>").replace(/^# (.*)$/gm,"<h2>$1</h2>");
  h=h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`\n]+)`/g,"<code>$1</code>");
  h=h.replace(/(^|\n)((?:[-*] .*(?:\n|$))+)/g,(m,a,l)=>a+"<ul>"+l.trim().split("\n").map(x=>"<li>"+x.slice(2)+"</li>").join("")+"</ul>\n");
  h=h.replace(/(^|\n)((?:\d+\. .*(?:\n|$))+)/g,(m,a,l)=>a+"<ol>"+l.trim().split("\n").map(x=>"<li>"+x.replace(/^\d+\.\s/,"")+"</li>").join("")+"</ol>\n");
  h=h.replace(/\n?(<\/?(?:ul|ol|h2|h3|h4)>)\n?/g,"$1").replace(/\n?\u0000(\d+)\u0000\n?/g,"\u0000$1\u0000");
  h=h.replace(/\n/g,"<br>");
  return h.replace(/\u0000(\d+)\u0000/g,(m,i)=>codeBlock(...blocks[i]));
}

// ---------- 状態 ----------
const SYS_CHAT = "あなたは親切で有能なAIアシスタントです。ユーザーが日本語で話しかけたら日本語で、正確に答えてください。わからないことは推測せず、わからないと伝えてください。";
const SYS_APP = "あなたは優秀なフロントエンド開発者です。ユーザーの依頼に合うWebアプリを、HTML・CSS・JavaScriptを1ファイルにまとめた完全なHTMLとして、```html のコードブロック1つで出力してください。外部ライブラリ・CDN・外部画像は使わないこと。見た目はモダンで美しく、スマホでも使えるレスポンシブにし、UIの文言は日本語にしてください。既存コードが渡された場合は、依頼に合わせて修正した完全なコード全文を出力してください(省略禁止)。コードの前後の説明は2文以内で簡潔に。";
const SUGGEST = {
  chat:["今日のおすすめの勉強法を教えて","この文章を丁寧な敬語に直して","Pythonでフィボナッチ数列を書いて"],
  app:["見た目のいいToDoアプリ","ポモドーロタイマー","2048ゲーム","家計簿アプリ(円グラフ付き)","マインスイーパー"]
};
let mode=LS.get("oai_mode","chat"), backend=LS.get("oai_backend","web");
let chats=[], cur=null, engine=null, busy=false, abortFlag=false, ctrl=null;
const key=()=>"oai_chats_"+me.sub;
const save=()=>LS.set(key(),chats);
const setStatus=t=>$("#status").textContent=t;

// ---------- チャット一覧 ----------
function title(c){return (c.messages.find(m=>m.role==="user")?.content||"新しい会話").slice(0,28)}
function renderList(){
  const l=$("#list");l.innerHTML="";
  chats.forEach(c=>{
    const d=document.createElement("div");d.className="chat"+(c===cur?" cur":"");
    d.innerHTML=`<span></span><i title="削除">✕</i>`;d.firstChild.textContent=(c.code?"🛠 ":"")+title(c);
    d.onclick=()=>{cur=c;renderList();renderMsgs();syncPreview()};
    d.querySelector("i").onclick=e=>{e.stopPropagation();chats=chats.filter(x=>x!==c);if(cur===c)cur=chats[0]||newChat(false);save();renderList();renderMsgs();syncPreview()};
    l.appendChild(d);
  });
}
function newChat(r=true){const c={id:Date.now(),messages:[],code:""};chats.unshift(c);cur=c;if(r){save();renderList();renderMsgs();syncPreview()}return c}
$("#new").onclick=()=>newChat();

function bubble(role,text){
  const d=document.createElement("div");d.className="m "+role;
  if(role==="user")d.textContent=text;else d.innerHTML=md(text);
  $("#msgs").appendChild(d);return d;
}
function scrollEnd(){const m=$("#msgs");m.scrollTop=m.scrollHeight}
function renderMsgs(){
  const box=$("#msgs");box.innerHTML="";
  if(!cur.messages.length){
    box.innerHTML=`<div id="empty"><h2>${mode==="app"?"何を作りますか?":"何でも聞いてください"}</h2><div>${mode==="app"?"作りたいアプリを日本語で伝えると、右側に動くものが出来上がります。続けて「ボタンを大きく」などと頼めば直せます。":"オフラインでも、回数制限なしで使えます。"}</div><div class="chips"></div></div>`;
    SUGGEST[mode].forEach(t=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{$("#input").value=t;send()};box.querySelector(".chips").appendChild(b)});
    return;
  }
  cur.messages.forEach(m=>bubble(m.role,m.content));scrollEnd();
}
$("#msgs").addEventListener("click",e=>{
  const b=e.target.closest("[data-copy]");if(!b)return;
  navigator.clipboard?.writeText(b.closest(".cb").querySelector("code").textContent);
  b.textContent="コピー済";setTimeout(()=>b.textContent="コピー",1200);
});

// ---------- プレビュー ----------
const frame=$("#frame"), codeEl=$("#code");
function extractHtml(text){
  const all=[...text.matchAll(/```html[^\n]*\n([\s\S]*?)(?:```|$)/gi)];
  if(all.length)return all[all.length-1][1].trim();
  const m=text.match(/<!doctype html[\s\S]*<\/html>/i);return m?m[0]:"";
}
function syncPreview(){
  const has=!!cur?.code;
  frame.style.display=has?"block":"none";$("#pvempty").style.display=has?"none":"flex";
  if(has)frame.srcdoc=cur.code;
  codeEl.value=cur?.code||"";
}
function showPane(which){
  const code=which==="code";
  codeEl.style.display=code?"block":"none";$("#pvApply").style.display=code?"":"none";
  $("#tabCode").className=code?"primary":"";$("#tabPrev").className=code?"":"primary";
}
$("#tabPrev").onclick=()=>showPane("prev");$("#tabCode").onclick=()=>showPane("code");
$("#pvApply").onclick=()=>{cur.code=codeEl.value;save();syncPreview();showPane("prev")};
$("#pvReload").onclick=()=>{if(cur.code)frame.srcdoc=cur.code};
$("#pvOpen").onclick=()=>{if(!cur.code)return;window.open(URL.createObjectURL(new Blob([cur.code],{type:"text/html"})),"_blank")};
$("#pvDl").onclick=()=>{if(!cur.code)return;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([cur.code],{type:"text/html"}));a.download="app.html";a.click()};
$("#pvClose").onclick=()=>$("#pv").classList.remove("on");
$("#pvtoggle").onclick=()=>$("#pv").classList.add("on");

// ---------- モード / バックエンド UI ----------
function applyUI(){
  document.querySelectorAll("#modeseg button").forEach(b=>b.classList.toggle("cur",b.dataset.m===mode));
  document.querySelectorAll("#beseg button").forEach(b=>b.classList.toggle("cur",b.dataset.b===backend));
  $("#url").style.display=backend==="server"?"":"none";
  $("#pv").classList.toggle("on",mode==="app"&&innerWidth>900);
  $("#pvtoggle").classList.toggle("vis",mode==="app");
  $("#input").placeholder=mode==="app"?"作りたいアプリ、または直したい点を入力…":"メッセージを入力(Enterで送信 / Shift+Enterで改行)";
  fillModels();
  if(cur)renderMsgs();
}
document.querySelectorAll("#modeseg button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;LS.set("oai_mode",mode);applyUI()});
document.querySelectorAll("#beseg button").forEach(b=>b.onclick=()=>{if(busy)return;backend=b.dataset.b;LS.set("oai_backend",backend);engine=null;$("#send").disabled=true;$("#bar div").style.width="0";applyUI();initialStatus()});
function fillModels(){
  const sel=$("#model");sel.innerHTML="";
  if(backend==="web"){
    WEB_MODELS.forEach(([id,l])=>sel.add(new Option(l,id)));
    const defId=mode==="app"
      ?(IOS?"Qwen2.5-Coder-1.5B-Instruct-q4f16_1-MLC":"Qwen2.5-Coder-3B-Instruct-q4f16_1-MLC")
      :(IOS?"Qwen2.5-1.5B-Instruct-q4f16_1-MLC":"Qwen2.5-3B-Instruct-q4f16_1-MLC");
    sel.value=LS.get("oai_model",defId);
    if(!sel.value)sel.selectedIndex=0;
    $("#load").textContent="モデルを読み込む";
  }else{
    const saved=LS.get("oai_server_model","");
    if(saved)sel.add(new Option(saved,saved));
    $("#load").textContent="接続する";
  }
}
$("#url").value=LS.get("oai_server_url","http://localhost:11434");
$("#temp").value=LS.get("oai_temp",0.7);$("#custom").value=LS.get("oai_custom","");
$("#temp").onchange=e=>LS.set("oai_temp",+e.target.value);
function syncSave(){
  const dirty=$("#custom").value.trim()!==LS.get("oai_custom","");
  $("#saveCustom").disabled=!dirty;
  $("#saveCustom").textContent=dirty?"保存":"保存済み ✓";
  $("#saveNote").textContent=dirty?"まだ保存されていません。":($("#custom").value.trim()?"この指示を毎回AIに渡しています。":"文字を入力すると、保存できます。");
}
$("#custom").addEventListener("input",syncSave);
$("#saveCustom").onclick=()=>{const v=$("#custom").value.trim();LS.set("oai_custom",v);$("#custom").value=v;syncSave()};
syncSave();
function initialStatus(){
  setStatus(backend==="web"
    ?(IOS?"iPad/iPhoneは1.5B前後のモデルが安定です(3B以上は落ちることあり)。初回のみダウンロード。共有ボタン→「ホーム画面に追加」で開くと、端末内のデータが消えにくくオフラインも安定します。"
         :"初回のみモデルをダウンロードします(以後はオフラインOK)。")
    :"パソコンで Ollama / LM Studio を起動し、URLを確認して「接続する」。大きなモデルほど賢くなります(README参照)。");
}

// ---------- AIエンジン ----------
async function loadModel(){
  const sel=$("#model");$("#load").disabled=true;sel.disabled=true;
  try{
    if(backend==="web"){
      if(!navigator.gpu){setStatus("このブラウザはWebGPU非対応です。最新のChrome/Edge、Safari 18以降で開くか、「高性能(Ollama等)」を使ってください。");return}
      LS.set("oai_model",sel.value);setStatus("エンジンを準備中…");
      const webllm=await import("https://esm.run/@mlc-ai/web-llm");
      const eng=await webllm.CreateMLCEngine(sel.value,{initProgressCallback:p=>{$("#bar div").style.width=Math.round((p.progress||0)*100)+"%";setStatus(p.text)}});
      engine={type:"web",eng};$("#bar div").style.width="100%";
      setStatus("準備完了。モデルは端末に保存済みで、次回からオフラインでも使えます。");
      try{await navigator.storage?.persist?.()}catch{}
    }else{
      const base=$("#url").value.trim().replace(/\/+$/,"");LS.set("oai_server_url",base);
      setStatus("接続中…");
      const r=await fetch(base+"/v1/models");if(!r.ok)throw new Error("HTTP "+r.status);
      const j=await r.json();const ids=(j.data||[]).map(x=>x.id);
      if(!ids.length)throw new Error("モデルが見つかりません(Ollamaなら `ollama pull qwen2.5-coder:7b` など)");
      const prev=LS.get("oai_server_model","");sel.innerHTML="";ids.forEach(i=>sel.add(new Option(i,i)));
      sel.value=ids.includes(prev)?prev:ids[0];LS.set("oai_server_model",sel.value);
      sel.onchange=()=>{LS.set("oai_server_model",sel.value);if(engine)engine.model=sel.value};
      engine={type:"server",base,model:sel.value};$("#bar div").style.width="100%";
      setStatus(`接続しました(${ids.length}個のモデル)。上のリストで切り替えられます。`);
    }
    $("#send").disabled=false;
  }catch(e){
    console.error(e);
    setStatus("失敗: "+(e.message||e)+(backend==="server"?"(Ollamaは環境変数 OLLAMA_ORIGINS にこのページのURLを設定してください)":(navigator.onLine?"":"(初回ダウンロードにはネット接続が必要です)")));
  }finally{$("#load").disabled=false;sel.disabled=false}
}
$("#load").onclick=loadModel;

async function generate(messages,onToken){
  const temperature=+($("#temp").value||0.7);
  if(engine.type==="web"){
    const stream=await engine.eng.chat.completions.create({messages,stream:true,temperature});
    for await(const ch of stream){
      if(abortFlag){engine.eng.interruptGenerate();break}
      onToken(ch.choices[0]?.delta?.content||"");
    }
  }else{
    ctrl=new AbortController();
    const r=await fetch(engine.base+"/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json"},signal:ctrl.signal,
      body:JSON.stringify({model:engine.model,messages,stream:true,temperature})});
    if(!r.ok)throw new Error("HTTP "+r.status+" "+(await r.text()).slice(0,200));
    const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
    for(;;){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf("\n"))>=0){
        const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(!line.startsWith("data:"))continue;
        const d=line.slice(5).trim();if(d==="[DONE]")return;
        try{onToken(JSON.parse(d).choices?.[0]?.delta?.content||"")}catch{}
      }
    }
  }
}

function buildMessages(){
  const custom=(LS.get("oai_custom","")||"").trim();
  const sys=(mode==="app"?SYS_APP:SYS_CHAT)+(custom?"\n\n追加の指示: "+custom:"");
  if(mode==="app"){
    // アプリ作成: 文脈長を節約するため「現在のコード+今回の依頼」だけ渡す
    const last=cur.messages[cur.messages.length-1].content;
    const u=cur.code?`現在のコード:\n\`\`\`html\n${cur.code}\n\`\`\`\n\n依頼: ${last}`:last;
    return [{role:"system",content:sys},{role:"user",content:u}];
  }
  return [{role:"system",content:sys},...cur.messages.slice(-16).map(m=>({role:m.role,content:m.content}))];
}

async function send(){
  const input=$("#input"),text=input.value.trim();
  if(!text||!engine||busy)return;
  if(!cur.messages.length)$("#msgs").innerHTML="";
  input.value="";input.style.height="auto";
  cur.messages.push({role:"user",content:text});bubble("user",text);
  const out=bubble("assistant","…");scrollEnd();
  busy=true;abortFlag=false;$("#send").style.display="none";$("#stop").style.display="";
  let acc="",raf=0;
  const paint=()=>{raf=0;out.innerHTML=md(acc);scrollEnd()};
  try{
    await generate(buildMessages(),t=>{acc+=t;if(!raf)raf=requestAnimationFrame(paint)});
  }catch(e){
    if(e.name!=="AbortError"){
      const m=String(e.message||e);
      if(/disposed|map async|device.*lost|compatible GPU/i.test(m)){
        acc+=(acc?"\n\n":"")+"⚠ GPUが停止しました(メモリ不足の可能性)。アプリを完全に閉じて開き直し、もっと軽いモデルを選んでください。";
        engine=null;$("#send").disabled=true;setStatus("GPUが停止しました。アプリを閉じて開き直してください。");
      }else acc+=(acc?"\n\n":"")+"⚠ エラー: "+m;
    }
  }
  cancelAnimationFrame(raf);out.innerHTML=md(acc||"(応答なし)");
  cur.messages.push({role:"assistant",content:acc});
  if(mode==="app"){const h=extractHtml(acc);if(h){cur.code=h;syncPreview();showPane("prev");if(innerWidth<=900)$("#pv").classList.add("on")}}
  save();renderList();scrollEnd();
  busy=false;$("#send").style.display="";$("#stop").style.display="none";
}
$("#form").onsubmit=e=>{e.preventDefault();send()};
$("#stop").onclick=()=>{abortFlag=true;ctrl?.abort()};
$("#input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$("#input").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px"});

$("#export").onclick=()=>{
  const t=cur.messages.map(m=>(m.role==="user"?"## あなた\n":"## AI\n")+m.content).join("\n\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/markdown"}));a.download="chat.md";a.click();
};

// ---------- 起動 ----------
function enter(){
  $("#login").style.display="none";$("#app").style.display="flex";$("#logout").style.display=me.sub==="guest"?"none":"";
  $("#user").innerHTML=(me.picture?`<img src="${me.picture}" referrerpolicy="no-referrer" onerror="this.remove()">`:"")+`<span></span>`;
  $("#user span").textContent=me.name||me.email||"";
  chats=LS.get(key(),[]);if(!chats.length)newChat(false);cur=chats[0];
  applyUI();initialStatus();renderList();syncPreview();
}
if(me)enter();   // 一度ログインすれば、オフラインでもそのまま入れる
</script>
